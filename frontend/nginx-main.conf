# nginx principal del contenedor frontend.
#
# Ejecuta como usuario no-root (USER nginx, kernel rights drop). Por eso:
#  - listen 8080 (nível de sysctl no privilegiado, sin NET_BIND_SERVICE)
#  - pid en /tmp (el resto del / está montado read-only en prod)
#  - paths temporales bajo /tmp
# El reverse proxy del host (nginx/caddy, fuera de Docker) termina TLS y
# enruta aquí en loopback; aquí SOLO se sirve el build estático del SPA.
user nginx;
worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    server_tokens off;

    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;

    access_log /dev/stdout;
    error_log /dev/stderr;

    include /etc/nginx/conf.d/*.conf;
}