server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Headers de seguridad base. HSTS queda comentado hasta tener TLS delante
    # (certbot en el host, o reverse proxy externo del proveedor).
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    # img-src incluye https: porque el logo de cada empresa (Company.logoUrl)
    # puede apuntar a un host externo, no solo a /api/uploads propio.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self'" always;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # El browser solo habla con nginx (mismo origen); nginx reenvía /api/* a
    # Kong, que aplica JWT/CORS/rate-limit antes de delegar al backend.
    location /api/ {
        proxy_pass http://kong:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
