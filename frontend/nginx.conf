server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Headers de seguridad. TLS termina en el reverse proxy del host: el
    # HSTS real debe estar también ahí (este contenedor solo atiende loopback).
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;

    # CSP estricto: la SPA habla con /api (mismo origen, vía proxy del host).
    # Los estilos inline los exigen muchas UI kits (--unsafe-inline) y las
    # fuentes vienen de Google Fonts (bloqueadas a HTTPS).
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: https:; font-src 'self' https://fonts.gstatic.com https://fonts.googleapis.com; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    # El Service Worker y su registro NUNCA se cachean a nivel HTTP: la
    # estrategia de actualización la controla el propio SW (workbox), no el
    # cache del navegador.
    location = /sw.js {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }
    location ~ ^/(dev-sw\.js|registerSW\.js)$ {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}