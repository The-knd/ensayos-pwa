server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Este nginx (dentro del contenedor) SOLO sirve el build estático del SPA.
    # El servicio de estáticos, el ruteo de /api/* hacia Kong y los headers de
    # seguridad viven en el reverse proxy del host (fuera de Docker), que es el
    # único punto de entrada en producción.

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}