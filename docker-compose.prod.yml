services:
  postgres:
    image: postgres:16-alpine
    container_name: pwa-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Define POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD (openssl rand -base64 48)}
      POSTGRES_DB: ${POSTGRES_DB:?Define POSTGRES_DB}
    # Sin puertos publicados al host: solo backend/migraciones lo alcanzan
    # por la red interna de Docker.
    volumes:
      - pgdata:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: pwa-redis
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Define REDIS_PASSWORD (openssl rand -base64 32)}
    command: ["sh", "-c", "redis-server --appendonly yes --requirepass \"$REDIS_PASSWORD\""]
    volumes:
      - redisdata:/data
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
    container_name: pwa-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env.prod
    # Migraciones automáticas en cada deploy, antes de levantar el servidor.
    # Se ejecutan con DB_MIGRATE_AS_OWNER=true para conectar como DB_USER
    # (owner, puede hacer DDL) aunque el runtime use DB_APP_USER. Las variables
    # DB_APP_* siguen visibles para que RlsHardening pueda crear el rol.
    command:
      - sh
      - -c
      - DB_MIGRATE_AS_OWNER=true npx typeorm migration:run -d dist/database/data-source.js && node dist/main
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 768M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    # Sin volumes: la imagen es inmutable, todo el código ya está en dist/.

  kong:
    image: kong:3.6
    container_name: pwa-kong
    restart: unless-stopped
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /kong/kong.yml
      KONG_PROXY_LISTEN: "0.0.0.0:8000"
      KONG_ADMIN_LISTEN: "127.0.0.1:8001"
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?Define JWT_ACCESS_SECRET (openssl rand -base64 48)}
      KONG_CORS_ORIGINS: ${KONG_CORS_ORIGINS:?Define KONG_CORS_ORIGINS, ej. ["https://tu-dominio.com"]}
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Define REDIS_PASSWORD}
      # El reverse proxy del host es el peer inmediato (loopback): confiar su
      # X-Forwarded-For para que el rate-limit use la IP real del cliente y no
      # 127.0.0.1 (que compartiría un único contador para todos).
      KONG_TRUSTED_IPS: "127.0.0.1"
      KONG_REAL_IP_HEADER: "X-Forwarded-For"
    volumes:
      - ./backend/kong:/kong
    entrypoint: ["/bin/sh", "/kong/start.sh"]
    # Solo publicado a loopback: exclusivamente el reverse proxy del host lo
    # alcanza. El admin API (8001) queda interno al contenedor.
    ports:
      - "127.0.0.1:8000:8000"
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "kong", "health"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    depends_on:
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: production
    container_name: pwa-frontend
    restart: unless-stopped
    # Solo loopback: el reverse proxy del host sirve TLS y rutea al contenedor.
    # Este nginx internamente solo sirve el build estático (dist/); no conoce
    # Kong.
    ports:
      - "127.0.0.1:8080:80"
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  pgdata:
  redisdata:
